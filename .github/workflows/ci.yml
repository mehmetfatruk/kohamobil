name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run build typecheck lint test

  secrets:
    name: Secret taraması (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose:
    name: Docker Compose doğrulaması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose config
        working-directory: infra/docker
        env:
          SECRETS_DIR: /tmp/ci-secrets
          PUBLIC_API_URL: https://api.koha-tr.com
          ACME_EMAIL: ci@example.com
        run: |
          docker compose -f compose.base.yml config -q
          docker compose -f compose.base.yml -f compose.dev.yml config -q
